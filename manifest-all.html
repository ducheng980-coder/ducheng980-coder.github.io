<p>店主操作说明：从上到下依次点每个按钮，在 GitHub 确认页点 "Create GitHub App"，然后把跳转后地址栏里 ?code= 后面那串字符发给对应的 Muse。每个按钮重复一次即可。</p>

<h1>Muse 2 — Read</h1>
<form action="https://github.com/settings/apps/new" method="post">
  <input type="hidden" name="manifest" value='{"name":"MFXGJ-Muse2-Read","url":"https://github.com/ducheng980-coder","redirect_url":"https://github.com/settings/apps","public":false,"default_permissions":{"contents":"read"},"default_events":[]}'>
  <input type="submit" value="Create MFXGJ-Muse2-Read">
</form>
